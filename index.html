<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1524" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Study app for DECA Buying & Merchandising Team Decision Making: exam trainer, flashcards, retail math lab, and case simulator. Works offline." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sell-Through" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />
    <title>Sell-Through: BTDM Prep</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('st-theme') || '"system"');
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var m = JSON.parse(localStorage.getItem('st-motion') || '"on"');
        var reduced = m === 'off' || (m === 'device' && matchMedia('(prefers-reduced-motion: reduce)').matches);
        document.documentElement.dataset.motion = reduced ? 'reduced' : 'full';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
